name: eval-smoke

# Portão de qualidade do SRI **por PR** — versão leve do eval-gate.yml.
# Roda a avaliação no split de DEV com o encoder **e5-small** (índice ~100 MB,
# modelo ~470 MB) e falha se o nDCG@10 da fusão cair abaixo do limiar.
#
# Só dispara quando o PR mexe no que afeta a recuperação (ver `paths`); PRs de
# frontend/auth/docs pulam. O eval-gate.yml semanal (e5-large) segue como o
# check pesado.
#
# CUSTO / B2: o `.dvc/cache` é cacheado pelo GitHub e chaveado pelos ponteiros
# `*.dvc` deste job. Como o índice e o `movies.db` quase nunca mudam, o cache
# acerta e o `dvc pull` roda **sem tocar no B2** (o free tier do B2 dá só 1 GB
# de download/dia e o movies.db tem 1,2 GB). O B2 só é acessado quando o índice
# ou o catálogo mudam de verdade.
#
# Requer os secrets DVC_ACCESS_KEY_ID / DVC_SECRET_ACCESS_KEY (mesmos do eval-gate).
#
# LIMIAR: medido local e no CI, a fusão e5-small no split dev dá nDCG@10 ≈ 0,707.
# O default 0,65 fica ~0,057 abaixo — pega regressão real (fusão quebrada cai
# para ~0,3–0,5) sem falso-positivo por ruído.

on:
  pull_request:
    paths:
      - "retrieval/**"
      - "eval/**"
      - "core/catalog.py"
      - "core/db.py"
      - "core/metrics.py"
      - "core/device.py"
      - "requirements.txt"
      - "requirements-ci.txt"
      - ".github/workflows/eval-smoke.yml"
  workflow_dispatch:
    inputs:
      min_ndcg:
        description: "limiar mínimo de nDCG@10 (fusão, split dev, e5-small)"
        default: "0.65"

concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - run: pip install -r requirements.txt "dvc-s3"

      # .dvc/cache chaveado pelos ponteiros que este job puxa. Hit = dvc pull
      # resolve tudo do cache local, sem request ao B2.
      - name: cache do .dvc/cache (índice e5-small + catálogo)
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: eval-smoke-dvc-${{ hashFiles('retrieval/index_e5small.dvc', 'data/raw/movies.db.dvc') }}
          restore-keys: |
            eval-smoke-dvc-

      - name: dvc pull (só o que faltar no cache)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::secrets DVC_* ausentes — configure o remote B2 para o eval-smoke rodar."
            exit 1
          fi
          dvc pull -v retrieval/index_e5small.dvc data/raw/movies.db.dvc

      - name: cache do modelo HuggingFace (e5-small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v1

      - name: eval no split dev (e5-small) + portão de nDCG@10
        env:
          RECOMENDAI_DEVICE: cpu
          RECOMENDAI_TMDB_NAMES: "0"
          RECOMENDAI_INDEX_DIR: retrieval/index_e5small
        run: |
          python -m eval.run --split dev --fast --no-write \
            --gate-ndcg "${{ github.event.inputs.min_ndcg || '0.65' }}"
