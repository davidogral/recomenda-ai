<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin — Cinerd</title>
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='icon-96.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        .adm { max-width: 1120px; margin: 0 auto; padding: 32px 20px 80px; }
        .adm h1 { font-size: 1.5rem; }
        .adm .sub { color: var(--gray); font-size: var(--fs-sm); margin: 4px 0 20px; }
        .adm .sub a { color: var(--primary-hover); }
        .adm-nav { display: flex; gap: 8px; margin-bottom: 22px; align-items: center; flex-wrap: wrap; }
        .adm-nav button { font: inherit; font-size: var(--fs-sm); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--gray); cursor: pointer; }
        .adm-nav button.on { color: var(--light); border-color: var(--accent-border); background: var(--accent-soft); }
        .adm-nav .days { margin-left: auto; color: var(--gray); font-size: var(--fs-sm); }
        .adm-nav select { font: inherit; font-size: var(--fs-sm); background: var(--input-bg); color: var(--light); border: 1px solid var(--input-border); border-radius: var(--radius-sm); padding: 5px 8px; }
        .adm-tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .adm-tile { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 12px 18px; min-width: 120px; }
        .adm-tile .n { font-size: 1.6rem; font-weight: 700; color: var(--light); }
        .adm-tile .l { font-size: var(--fs-xs); color: var(--gray); text-transform: uppercase; letter-spacing: .04em; }
        .adm-spark { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin: 10px 0 24px; }
        .adm-spark i { flex: 1; background: var(--accent-border); border-radius: 2px 2px 0 0; min-height: 2px; }
        .adm-spark i.z { background: var(--card-border); }
        .adm-scroll { overflow-x: auto; border-radius: var(--radius-sm); }
        table.adm-t { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); min-width: 640px; }
        .adm-t th, .adm-t td { padding: 8px 12px; border-bottom: 1px solid var(--card-border); text-align: right; white-space: nowrap; }
        .adm-t th:first-child, .adm-t td:first-child, .adm-t th:nth-child(2), .adm-t td:nth-child(2) { text-align: left; }
        .adm-t thead th { color: var(--gray); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; }
        .adm-t tbody tr { cursor: pointer; }
        .adm-t tbody tr:hover { background: var(--card-hover); }
        .adm-t tr.sel { background: var(--accent-soft); }
        .adm-t .off { color: var(--gray); }
        .pill { font-size: var(--fs-xs); border-radius: 999px; padding: 1px 7px; border: 1px solid var(--card-border); }
        .pill.ok { color: #7fdca4; border-color: rgba(127,220,164,.35); }
        .pill.no { color: var(--gray); }
        .adm-detail { margin-top: 22px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px 20px; }
        .adm-detail h2 { font-size: 1.1rem; }
        .adm-detail .meta { color: var(--gray); font-size: var(--fs-sm); margin: 4px 0 14px; }
        .adm-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
        .adm-actions button { font: inherit; font-size: var(--fs-sm); padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--input-border); background: var(--input-bg); color: var(--light); cursor: pointer; }
        .adm-actions button:hover { border-color: var(--border-strong); }
        .adm-actions button.danger { color: var(--primary-hover); border-color: var(--accent-border); }
        .adm-detail h3 { font-size: var(--fs-md); margin: 14px 0 6px; color: var(--gray); }
        .adm-detail ul { list-style: none; }
        .adm-detail li { padding: 5px 0; border-bottom: 1px solid var(--card-border); font-size: var(--fs-sm); }
        .adm-detail .rv { color: var(--gray); font-style: italic; }
        .adm-msg { min-height: 1.3em; font-size: var(--fs-sm); color: var(--gray); }
        .adm-empty { color: var(--gray); font-size: var(--fs-sm); }

        /* --- Analytics --- */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 12px 14px; }
        .kpi .v { font-size: 1.5rem; font-weight: 700; color: var(--light); }
        .kpi .l { font-size: var(--fs-xs); color: var(--gray); text-transform: uppercase; letter-spacing: .04em; }
        .kpi .d { font-size: var(--fs-xs); margin-top: 2px; }
        .kpi .d.up { color: #7fdca4; } .kpi .d.down { color: #f0a0a4; } .kpi .d.flat { color: var(--gray); }
        .adm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
        .adm-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
        .adm-card h3 { font-size: var(--fs-md); margin: 0 0 4px; color: var(--light); }
        .adm-card .cap { font-size: var(--fs-xs); color: var(--gray); margin-bottom: 10px; }
        .adm-card.wide { grid-column: 1 / -1; }
        .chart-box { position: relative; height: 240px; }
        .adm-rank { font-size: var(--fs-sm); list-style: none; }
        .adm-rank li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--card-border); }
        .adm-rank li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .adm-rank li b { color: var(--gray); font-weight: 600; flex: none; }
        .adm-card.zero .adm-rank li span { color: #f0b8bb; }
        .adm-mini { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
        .adm-mini td, .adm-mini th { padding: 5px 8px; border-bottom: 1px solid var(--card-border); text-align: right; }
        .adm-mini th:first-child, .adm-mini td:first-child { text-align: left; color: var(--gray); }
        .heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 10px; }
        .heat .hh { color: var(--gray); text-align: center; }
        .heat .dd { color: var(--gray); align-self: center; }
        .heat i { aspect-ratio: 1; border-radius: 2px; background: var(--card-border); display: block; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="adm">
        <h1>Painel Admin</h1>
        <p class="sub"><a href="/">← Cinerd</a> · dados de contas e uso · acesso restrito à allowlist</p>

        <div class="adm-nav">
            <button id="tabAccounts" class="on" type="button">Contas</button>
            <button id="tabUsage" type="button">Uso</button>
            <label class="days" hidden id="daysWrap">janela
                <select id="daysSel"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select>
            </label>
        </div>

        <section id="viewAccounts">
            <div class="adm-tiles" id="tiles"></div>
            <div class="adm-spark" id="spark" title="cadastros por dia (30d)"></div>
            <div class="adm-scroll">
                <table class="adm-t">
                    <thead><tr>
                        <th>#</th><th>e-mail</th><th>verif.</th><th>ativa</th>
                        <th>diário</th><th>resenhas</th><th>listas</th><th>criada</th>
                    </tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div id="detail"></div>
        </section>

        <section id="viewUsage" hidden>
            <div id="usageStatus" class="adm-empty">carregando…</div>
            <div id="usageBody" hidden>
                <div class="kpis" id="kpis"></div>
                <div class="adm-grid" id="usageGrid"></div>
            </div>
        </section>
    </div>

    <script>
        'use strict';
        let CSRF = null;
        async function csrf() {
            if (CSRF) return CSRF;
            try { CSRF = (await (await fetch('/auth/csrf')).json()).csrf_token; } catch (e) { CSRF = ''; }
            return CSRF;
        }
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const $ = id => document.getElementById(id);

        // ================= CONTAS =================
        async function loadOverview() {
            const d = await (await fetch('/admin/api/overview')).json();
            $('tiles').innerHTML = [
                ['total', d.users.total], ['verificados', d.users.verified], ['ativas', d.users.active],
            ].map(([l, n]) => `<div class="adm-tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
            const days = d.signups_by_day || [];
            const max = Math.max(1, ...days.map(x => x.count));
            $('spark').innerHTML = days.map(x =>
                `<i class="${x.count ? '' : 'z'}" style="height:${Math.round(x.count / max * 100)}%" title="${x.date}: ${x.count}"></i>`).join('')
                || '<span class="adm-empty">sem cadastros nos últimos 30 dias</span>';
        }

        let selRow = null;
        async function loadUsers() {
            const d = await (await fetch('/admin/api/users')).json();
            $('rows').innerHTML = (d.users || []).map(u => {
                const c = u.counts || {};
                return `<tr data-uid="${u.user_id}">
                    <td>${u.user_id}</td>
                    <td>${esc(u.email)}</td>
                    <td>${u.email_verified ? '<span class="pill ok">✓</span>' : '<span class="pill no">—</span>'}</td>
                    <td>${u.is_active ? '<span class="pill ok">sim</span>' : '<span class="pill no">não</span>'}</td>
                    <td>${c.ratings || 0}</td><td>${c.reviews || 0}</td><td>${c.lists || 0}</td>
                    <td class="off">${esc((u.created_at || '').slice(0, 10))}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="8" class="adm-empty">nenhuma conta ainda</td></tr>';
            $('rows').querySelectorAll('tr[data-uid]').forEach(tr =>
                tr.onclick = () => { if (selRow) selRow.classList.remove('sel'); selRow = tr; tr.classList.add('sel'); showUser(tr.dataset.uid); });
        }

        async function showUser(uid) {
            $('detail').innerHTML = '<div class="adm-detail adm-empty">carregando…</div>';
            const d = await (await fetch('/admin/api/users/' + uid)).json();
            if (d.error) { $('detail').innerHTML = `<div class="adm-detail adm-empty">${esc(d.error)}</div>`; return; }
            const a = d.account;
            const ratings = (d.ratings || []).map(r =>
                `<li><strong>${esc(r.title || r.tmdb_id)}</strong>${r.release_year ? ' (' + r.release_year + ')' : ''}
                 — ${r.rating != null ? r.rating + '★' : 'sem nota'}${r.liked ? ' ❤' : ''}${r.watched_date ? ' · ' + esc(r.watched_date) : ''}
                 ${r.review ? `<br><span class="rv">"${esc(r.review)}"</span>` : ''}</li>`).join('') || '<li class="adm-empty">nada</li>';
            const lists = (d.lists || []).map(l =>
                `<li><strong>${esc(l.name)}</strong> — ${(l.items || []).length} filme(s)
                 ${l.items && l.items.length ? '<br><span class="rv">' + l.items.map(i => esc(i.title || i.tmdb_id)).join(' · ') + '</span>' : ''}</li>`).join('') || '<li class="adm-empty">nada</li>';
            const evs = (d.usage_events || []).slice(0, 40).map(e =>
                `<li>${esc((e.ts || '').slice(0, 16).replace('T', ' '))} · <strong>${esc(e.kind)}</strong>${e.query ? ' — “' + esc(e.query) + '”' : ''}
                 ${e.n_results != null ? ` (${e.n_results} result.)` : ''}${e.ref ? ' · ' + esc(e.ref) : ''}</li>`).join('') || '<li class="adm-empty">nada</li>';

            $('detail').innerHTML = `<div class="adm-detail">
                <h2>${esc(a.email)}</h2>
                <div class="meta">conta #${a.user_id} · criada ${esc((a.created_at || '').slice(0, 16).replace('T', ' '))}
                 · e-mail ${a.email_verified ? 'verificado' : 'não verificado'} · ${a.is_active ? 'ativa' : 'DESATIVADA'}</div>
                <div class="adm-actions">
                    ${a.is_active
                        ? `<button data-act="deactivate">Desativar conta</button>`
                        : `<button data-act="reactivate">Reativar conta</button>`}
                    ${a.email_verified ? '' : `<button data-act="resend-verification">Reenviar verificação</button>`}
                    <button class="danger" data-act="delete">Apagar conta e dados</button>
                </div>
                <div class="adm-msg" id="admMsg"></div>
                <h3>Diário (${(d.ratings || []).length})</h3><ul>${ratings}</ul>
                <h3>Listas (${(d.lists || []).length})</h3><ul>${lists}</ul>
                <h3>Uso recente (${(d.usage_events || []).length})</h3><ul>${evs}</ul>
            </div>`;
            $('detail').querySelectorAll('button[data-act]').forEach(b =>
                b.onclick = () => act(uid, b.dataset.act, a.email));
        }

        async function act(uid, action, email) {
            const labels = { deactivate: 'Desativar', reactivate: 'Reativar', delete: 'APAGAR (irreversível)', 'resend-verification': 'Reenviar verificação' };
            if (!confirm(`${labels[action]} — conta ${email}?`)) return;
            $('admMsg').textContent = '…';
            const r = await fetch(`/admin/api/users/${uid}/${action}`, { method: 'POST', headers: { 'X-CSRFToken': await csrf() } });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) { $('admMsg').textContent = j.error || ('erro ' + r.status); return; }
            $('admMsg').textContent = 'feito ✓';
            await loadUsers(); await loadOverview();
            if (action === 'delete') { $('detail').innerHTML = ''; } else { showUser(uid); }
        }

        // ================= USO =================
        const C = { search: '#e50914', open: '#4a9ed8', rec: '#7fdca4', zero: '#f0a020', a: '#7fdca4', b: '#4a9ed8', grid: 'rgba(255,255,255,0.06)', txt: '#9a9aa2' };
        const KLABEL = { search: 'busca', similar: 'parecidos', essentials: 'essenciais', recommend: 'recs (favoritos)', recommend_history: 'recs (diário)', recommend_letterboxd: 'recs (Letterboxd)', open: 'ficha aberta' };
        let charts = [];
        function chartsReady() { return typeof Chart !== 'undefined'; }

        function baseOpts(extra) {
            return Object.assign({
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: C.txt, boxWidth: 12, font: { size: 11 } } } },
                scales: {
                    x: { grid: { color: C.grid }, ticks: { color: C.txt, maxRotation: 0, autoSkipPadding: 12, font: { size: 10 } } },
                    y: { grid: { color: C.grid }, ticks: { color: C.txt, font: { size: 10 } }, beginAtZero: true },
                },
            }, extra || {});
        }
        function mkChart(id, cfg) {
            const el = $(id); if (!el || !chartsReady()) return;
            charts.push(new Chart(el.getContext('2d'), cfg));
        }

        function kpi(label, o, fmt) {
            const v = fmt ? fmt(o.v) : o.v;
            let d = '', cls = 'flat';
            if (o.delta != null) {
                const arrow = o.delta > 0 ? '▲' : o.delta < 0 ? '▼' : '–';
                cls = o.delta > 0 ? 'up' : o.delta < 0 ? 'down' : 'flat';
                // pra zero_rate, subir é ruim → inverte a cor
                if (label === 'sem resultado' && o.delta !== 0) cls = o.delta > 0 ? 'down' : 'up';
                d = `<div class="d ${cls}">${arrow} ${Math.abs(o.delta)}% vs período anterior</div>`;
            }
            return `<div class="kpi"><div class="v">${v}</div><div class="l">${label}</div>${d}</div>`;
        }

        function rankList(items, keyFrom, keyTo) {
            if (!items || !items.length) return '<div class="adm-empty">nada no período</div>';
            return `<ul class="adm-rank">${items.map(x =>
                `<li><span>${esc(keyFrom ? (x[keyFrom] + ' → ' + x[keyTo]) : x.query)}</span><b>${x.count}</b></li>`).join('')}</ul>`;
        }

        function heatmap(m) {
            const DOW = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
            const max = Math.max(1, ...m.flat());
            let h = '<div style="grid-column:1"></div>';
            for (let hr = 0; hr < 24; hr++) h += `<div class="hh">${hr % 3 === 0 ? hr : ''}</div>`;
            m.forEach((row, di) => {
                h += `<div class="dd">${DOW[di]}</div>`;
                row.forEach(v => {
                    const a = v ? (0.12 + 0.88 * v / max) : 0;
                    h += `<i style="${v ? `background:rgba(229,9,20,${a.toFixed(2)})` : ''}" title="${DOW[di]} ${''}h: ${v}"></i>`;
                });
            });
            return `<div class="heat">${h}</div>`;
        }

        async function loadUsage() {
            charts.forEach(c => { try { c.destroy(); } catch (e) {} }); charts = [];
            $('usageStatus').hidden = false; $('usageBody').hidden = true;
            const d = await (await fetch('/admin/api/analytics?days=' + $('daysSel').value)).json();
            const k = d.kpis || {};

            $('kpis').innerHTML = [
                kpi('buscas', k.searches || { v: 0 }),
                kpi('CTR da busca', k.ctr || { v: 0 }, v => (v * 100).toFixed(0) + '%'),
                kpi('sem resultado', k.zero_rate || { v: 0 }, v => (v * 100).toFixed(0) + '%'),
                kpi('sessões', k.sessions || { v: 0 }),
                kpi('usuários ativos', k.users || { v: 0 }),
                kpi('recomendações', k.recs || { v: 0 }),
            ].join('');

            const by = d.by_day || [];
            const labels = by.map(x => x.day.slice(5));
            $('usageGrid').innerHTML = `
              <div class="adm-card wide"><h3>Volume por dia</h3><div class="cap">buscas · fichas abertas · recomendações · buscas sem resultado</div><div class="chart-box"><canvas id="cVolume"></canvas></div></div>

              <div class="adm-card"><h3>Posição do clique</h3><div class="cap">em que posição do resultado a pessoa clica (busca → ficha)</div><div class="chart-box"><canvas id="cPos"></canvas></div></div>
              <div class="adm-card"><h3>Funil da sessão</h3><div class="cap">sessões distintas que chegaram a cada etapa</div><div class="chart-box"><canvas id="cFunnel"></canvas></div></div>

              <div class="adm-card"><h3>Top buscas</h3><div class="cap">consultas de sinopse mais frequentes</div>${rankList(d.top_queries)}</div>
              <div class="adm-card zero"><h3>Buscas sem resultado</h3><div class="cap">buracos do catálogo — o motor não achou nada</div>${rankList(d.zero_result)}</div>

              <div class="adm-card"><h3>Reformulações</h3><div class="cap">o que a pessoa buscou → o que refez na mesma sessão</div>${rankList(d.reformulations, 'from', 'to')}</div>
              <div class="adm-card"><h3>Filmes mais abertos</h3><div class="cap">popularidade por uso real, não voto do TMDB</div>
                ${(d.top_items || []).length ? `<ul class="adm-rank">${d.top_items.map(x => `<li><span>${esc(x.title)}${x.year ? ' (' + x.year + ')' : ''}</span><b>${x.count}</b></li>`).join('')}</ul>` : '<div class="adm-empty">nada no período</div>'}</div>

              <div class="adm-card wide"><h3>Sessões novas × recorrentes</h3><div class="cap">por dia</div><div class="chart-box"><canvas id="cSess"></canvas></div></div>

              <div class="adm-card"><h3>Uso de filtros</h3>
                <div class="cap">${(d.filters || {}).with_any_filter || 0} de ${(d.filters || {}).of_searches || 0} buscas com filtro · ano ${(d.filters || {}).year_range || 0} · idioma ${(d.filters || {}).language || 0}</div>
                ${((d.filters || {}).genres || []).length ? `<ul class="adm-rank">${d.filters.genres.map(g => `<li><span>${esc(g.genre)}</span><b>${g.count}</b></li>`).join('')}</ul>` : '<div class="adm-empty">nenhum</div>'}</div>
              <div class="adm-card"><h3>Latência por etapa</h3><div class="cap">amostra da janela (ms) · ${(d.query_len || {}).avg ? 'consulta média ' + d.query_len.avg + ' car., ' + Math.round((d.query_len.short_share || 0) * 100) + '% curtas' : ''}</div>
                ${Object.keys(d.latency || {}).length ? `<table class="adm-mini"><thead><tr><th>etapa</th><th>p50</th><th>p95</th><th>p99</th><th>n</th></tr></thead><tbody>${Object.entries(d.latency).map(([s, v]) => `<tr><td>${esc(s)}</td><td>${v.p50}</td><td>${v.p95}</td><td>${v.p99}</td><td>${v.n}</td></tr>`).join('')}</tbody></table>` : '<div class="adm-empty">sem amostras</div>'}</div>

              <div class="adm-card wide"><h3>Atividade — hora × dia da semana</h3><div class="cap">todos os eventos da janela</div>${d.heatmap ? heatmap(d.heatmap) : ''}</div>

              <div class="adm-card wide"><h3>Engajamento por dia</h3><div class="cap">avaliações · resenhas · listas criadas</div><div class="chart-box"><canvas id="cEng"></canvas></div></div>`;

            const line = (id, ds) => mkChart(id, { type: 'line', data: { labels, datasets: ds }, options: baseOpts({ elements: { point: { radius: 0 }, line: { tension: .3, borderWidth: 2 } } }) });
            line('cVolume', [
                { label: 'buscas', data: by.map(x => x.search), borderColor: C.search, backgroundColor: C.search + '22', fill: true },
                { label: 'fichas', data: by.map(x => x.open), borderColor: C.open, backgroundColor: 'transparent' },
                { label: 'recs', data: by.map(x => x.rec), borderColor: C.rec, backgroundColor: 'transparent' },
                { label: 'sem resultado', data: by.map(x => x.zero), borderColor: C.zero, backgroundColor: 'transparent', borderDash: [4, 3] },
            ]);
            const sb = d.sessions_by_day || [];
            mkChart('cSess', {
                type: 'bar',
                data: {
                    labels: sb.map(x => x.day.slice(5)),
                    datasets: [
                        { label: 'novas', data: sb.map(x => x.new), backgroundColor: C.a },
                        { label: 'recorrentes', data: sb.map(x => x.returning), backgroundColor: C.b },
                    ],
                },
                options: baseOpts({ scales: { x: { stacked: true, grid: { color: C.grid }, ticks: { color: C.txt, font: { size: 10 } } }, y: { stacked: true, grid: { color: C.grid }, ticks: { color: C.txt, font: { size: 10 } }, beginAtZero: true } } }),
            });
            mkChart('cPos', {
                type: 'bar',
                data: { labels: (d.click_positions || []).map(x => x.bucket), datasets: [{ data: (d.click_positions || []).map(x => x.count), backgroundColor: C.open }] },
                options: baseOpts({ plugins: { legend: { display: false } } }),
            });
            mkChart('cFunnel', {
                type: 'bar',
                data: { labels: (d.funnel || []).map(x => x.step), datasets: [{ data: (d.funnel || []).map(x => x.sessions), backgroundColor: [C.search, C.rec, C.open] }] },
                options: baseOpts({ indexAxis: 'y', plugins: { legend: { display: false } } }),
            });
            const eg = d.engagement_by_day || [];
            mkChart('cEng', {
                type: 'bar',
                data: {
                    labels: eg.map(x => x.day.slice(5)),
                    datasets: [
                        { label: 'avaliações', data: eg.map(x => x.ratings), backgroundColor: C.rec },
                        { label: 'resenhas', data: eg.map(x => x.reviews), backgroundColor: C.open },
                        { label: 'listas', data: eg.map(x => x.lists), backgroundColor: C.zero },
                    ],
                },
                options: baseOpts({ scales: { x: { stacked: true, grid: { color: C.grid }, ticks: { color: C.txt, font: { size: 10 } } }, y: { stacked: true, grid: { color: C.grid }, ticks: { color: C.txt, font: { size: 10 } }, beginAtZero: true } } }),
            });

            $('usageStatus').hidden = true; $('usageBody').hidden = false;
        }

        // ================= nav =================
        function show(which) {
            const usage = which === 'usage';
            $('viewAccounts').hidden = usage;
            $('viewUsage').hidden = !usage;
            $('tabAccounts').classList.toggle('on', !usage);
            $('tabUsage').classList.toggle('on', usage);
            $('daysWrap').hidden = !usage;
            if (usage) loadUsage();
        }
        $('tabAccounts').onclick = () => show('accounts');
        $('tabUsage').onclick = () => show('usage');
        $('daysSel').onchange = () => loadUsage();

        loadOverview();
        loadUsers();
    </script>
</body>
</html>
