global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cinerd-api
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }

  - job_name: cinerd-inference
    static_configs:
      - targets: ["inference:9000"]
        labels: { service: inference }
