[mypy]
python_version = 3.9
ignore_missing_imports = True
# Checagem GRADUAL: só os módulos novos/limpos entram no portão do CI; imports
# do código legado são seguidos mas não reportados (follow_imports=silent).
follow_imports = silent
files = core/metrics.py,
        core/schemas.py,
        core/validate.py,
        core/inference_client.py,
        core/device.py,
        inference,
        eval
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True
disable_error_code = import-untyped, no-any-return, index, union-attr, arg-type, assignment

[mypy-eval.datasets.build_queries]
ignore_errors = True
